name: desktop

on:
  workflow_dispatch:
  push:
    paths:
      - desktop/**
      - backend/**
      - frontend/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - backend/**
      - frontend/**
      - .github/workflows/desktop.yml

jobs:
  client-only:
    name: Client-only (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            target: win
            artifact: vay-tutor-client-only-windows
            installer: desktop/release/*.exe
          - os: macos-latest
            label: macOS
            target: mac
            artifact: vay-tutor-client-only-macos
            installer: desktop/release/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the desktop toolchain
        working-directory: desktop
        run: npm ci

      - name: Test the host connection and tabs
        working-directory: desktop
        run: npm test

      - name: Build the client-only installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.target }}

      - name: Publish the client-only installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  full-installation:
    name: Full installation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/host/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the institute UI
        working-directory: frontend
        run: npm ci

      - name: Install the full-installation toolchain
        working-directory: desktop/host
        run: npm ci

      - name: Test the supervisor
        working-directory: desktop/host
        run: npm test

      - name: Stage MongoDB, Python, the API, and the UI
        run: node desktop/scripts/stage-full.js

      - name: Build the full installer
        working-directory: desktop/host
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64

      - name: Publish the full installer
        uses: actions/upload-artifact@v4
        with:
          name: vay-tutor-full-windows
          path: desktop/release/VayTutor-Setup-*.exe
          if-no-files-found: error
